[project]
name = "hbwm"
version = "0.1.0"
description = "Hebbian Belief-State World Model - Study 1"
requires-python = ">=3.12"
dependencies = ["torch>=2.5", "numpy>=1.26", "matplotlib>=3.8", "tqdm>=4.66"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
viz = ["imageio>=2.34", "nbformat>=5.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hbwm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
